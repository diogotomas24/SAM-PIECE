<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a18">
<meta name="description" content="La colección privada de Samuel.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SAM PIECE">
<title>SAM PIECE 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
:root{
  --navy-0:#03060f; --navy-1:#060a18; --navy-2:#0b1430; --navy-3:#13204a; --navy-4:#1d2f66;
  --gold:#e8b54a; --gold-2:#f7d98b; --gold-3:#a8781f; --white:#f4f2ec; --muted:#8e9ab8;
  --red:#d2343c; --ok:#4fd18b; --warn:#f2b84b; --bad:#ff5d6c;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ui:'Barlow Condensed',system-ui,sans-serif; --title:'Cinzel',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy-0);color:var(--white);font-family:var(--ui);font-size:17px;letter-spacing:.02em}
body{overflow-x:hidden;
  background:
   radial-gradient(1200px 600px at 50% -10%, #1a2a62 0%, transparent 60%),
   radial-gradient(800px 500px at 110% 110%, #2a1c08 0%, transparent 55%),
   linear-gradient(180deg,var(--navy-1),var(--navy-0));
  background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{min-height:100%;padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 14px) calc(var(--safe-b) + 92px) calc(var(--safe-l) + 14px);max-width:980px;margin:0 auto}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.brand{font-family:var(--title);font-weight:900;font-size:20px;letter-spacing:.12em;
  background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.3em;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-left:6px}
.pill{border:1px solid rgba(232,181,74,.35);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--gold-2);background:rgba(10,18,40,.6)}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px calc(var(--safe-r) + 10px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 10px);
  background:linear-gradient(180deg,rgba(3,6,15,0),rgba(3,6,15,.92) 35%);}
.nav-in{display:flex;gap:4px;padding:6px;border-radius:20px;background:rgba(11,20,48,.88);border:1px solid rgba(232,181,74,.22);
  box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;padding:7px 10px;border-radius:14px;
  color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--navy-0);background:linear-gradient(180deg,var(--gold-2),var(--gold))}

/* Bienvenida */
.splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(var(--safe-t) + 20px) 24px calc(var(--safe-b) + 30px);
  background:radial-gradient(700px 500px at 50% 40%, #1b2b66 0%, var(--navy-1) 55%, var(--navy-0) 100%)}
.splash .logo{font-family:var(--title);font-weight:900;font-size:clamp(46px,14vw,92px);line-height:.95;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff6d6,var(--gold) 50%,var(--gold-3));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #3b2606) drop-shadow(0 0 30px rgba(232,181,74,.35))}
.splash .logo span{display:block;font-size:.38em;letter-spacing:.5em;margin-top:8px}
.splash p{color:var(--muted);max-width:340px;margin:0;line-height:1.35}
.compass{width:120px;height:120px;animation:spin 40s linear infinite;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:14px;font-weight:700;font-size:18px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--navy-0);background:linear-gradient(180deg,var(--gold-2),var(--gold) 60%,var(--gold-3));
  box-shadow:0 0 0 1px rgba(255,240,200,.4) inset,0 8px 24px rgba(232,181,74,.25)}
.btn.ghost{color:var(--gold-2);background:rgba(11,20,48,.7);box-shadow:0 0 0 1px rgba(232,181,74,.4) inset}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn:active{transform:translateY(1px)}

/* Encabezado de sección */
.h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px}
.h h1{font-family:var(--title);font-weight:800;font-size:26px;margin:0;letter-spacing:.06em}
.h .sub{color:var(--muted);font-size:15px}

/* Progreso */
.progress{position:relative;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(29,47,102,.6),rgba(11,20,48,.6));
  border:1px solid rgba(232,181,74,.25);margin-bottom:16px;display:flex;align-items:center;gap:16px}
.progress .num{font-family:var(--title);font-weight:900;font-size:34px;color:var(--gold-2);white-space:nowrap}
.progress .num small{font-size:18px;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:0 0 0 1px rgba(232,181,74,.2) inset}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-3),var(--gold),var(--gold-2));box-shadow:0 0 12px var(--gold);transition:width .8s}

/* Rejilla de cartas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}}
.card{position:relative;aspect-ratio:63/88;border-radius:9px;overflow:hidden;display:block;text-decoration:none;color:inherit;
  transform:translateZ(0);transition:transform .2s}
.card:active{transform:scale(.97)}
.card .face{position:absolute;inset:0}
.back{background:
   radial-gradient(circle at 50% 46%, rgba(232,181,74,.18) 0 24%, transparent 25%),
   repeating-linear-gradient(45deg, rgba(232,181,74,.05) 0 2px, transparent 2px 9px),
   linear-gradient(160deg,#16255a,#081030 60%,#050916);
  box-shadow:0 0 0 2px #2b3a72 inset,0 0 0 4px #050916 inset,0 0 0 5px rgba(232,181,74,.55) inset}
.back .q{position:absolute;inset:0;display:grid;place-items:center}
.back .q svg{width:46%;opacity:.55}
.back .n{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.2em}
.front{background:linear-gradient(170deg,#24376f,#0c1534);box-shadow:0 0 0 2px var(--gold) inset,0 0 0 4px #050916 inset,0 0 0 5px rgba(247,217,139,.6) inset}
.front .art{position:absolute;left:8%;right:8%;top:7%;bottom:30%;border-radius:4px;overflow:hidden;
  background:radial-gradient(circle at 50% 35%, #33508f, #0d1736 75%);box-shadow:0 0 0 1px rgba(232,181,74,.45)}
.front .art svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:88%}
.front .meta{position:absolute;left:8%;right:8%;bottom:6%;height:20%;display:flex;flex-direction:column;justify-content:center;gap:1px}
.front .meta b{font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .meta span{font-size:11px;color:var(--gold-2);letter-spacing:.14em}
.front .badge{position:absolute;top:4%;right:5%;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:#050916;color:var(--gold-2);box-shadow:0 0 0 1px var(--gold)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);
  transform:translateX(-120%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.card.new{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.8);filter:brightness(2)}100%{transform:scale(1)}}

/* Paneles y formularios */
.panel{padding:16px;border-radius:16px;background:rgba(11,20,48,.72);border:1px solid rgba(232,181,74,.2);margin-bottom:14px}
.panel h2{font-family:var(--title);font-size:18px;margin:0 0 8px;letter-spacing:.06em;color:var(--gold-2)}
.panel p{margin:6px 0;line-height:1.35;color:#cfd5e6}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{font:inherit;font-size:18px;color:var(--white);background:#050916;border:1px solid rgba(232,181,74,.35);border-radius:12px;padding:11px 14px;outline:none;min-width:0}
input[type=text]{flex:1;letter-spacing:.12em;text-transform:lowercase}
input[type=text]:focus{border-color:var(--gold)}
.msg{margin-top:10px;font-size:16px;min-height:1.3em}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;padding:2px 8px;border-radius:6px;text-transform:uppercase}
.tag.ok{background:rgba(79,209,139,.15);color:var(--ok)} .tag.warn{background:rgba(242,184,75,.15);color:var(--warn)} .tag.bad{background:rgba(255,93,108,.15);color:var(--bad)} .tag.wait{background:rgba(142,154,184,.15);color:var(--muted)}

/* Ficha */
.ficha{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:720px){.ficha{grid-template-columns:300px 1fr}}
.ficha .card{max-width:300px;width:100%;margin:0 auto;pointer-events:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.dl dt{color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.12em;padding-top:2px}
.dl dd{margin:0;font-size:17px}

/* Visor 3D */
.viewer{position:fixed;inset:0;z-index:30;background:radial-gradient(900px 700px at 50% 40%,#1a2a60,#060a18 60%,#03060f)}
.viewer canvas{display:block;width:100%;height:100%;touch-action:none}
.viewer .bar3d{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) calc(var(--safe-r) + 14px) 10px calc(var(--safe-l) + 14px);pointer-events:none}
.viewer .bar3d > *{pointer-events:auto}
.viewer .title3d{font-family:var(--title);font-weight:800;letter-spacing:.08em;text-shadow:0 2px 10px #000}
.viewer .tools{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding:10px 14px calc(var(--safe-b) + 18px)}
.viewer .stats{position:absolute;left:calc(var(--safe-l) + 14px);bottom:calc(var(--safe-b) + 78px);font-size:13px;color:var(--muted);line-height:1.3;text-shadow:0 1px 4px #000}
.viewer .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;word-break:break-word;color:var(--gold-2);font-size:18px;letter-spacing:.2em;text-transform:uppercase}

/* Desbloqueo */
.unlock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(2,4,10,.96);overflow:hidden}
.unlock .stage{margin-bottom:120px}
.unlock canvas{position:absolute;inset:0;width:100%;height:100%}
.unlock .stage{position:relative;width:min(62vw,280px);aspect-ratio:63/88;perspective:1200px}
.unlock .flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.unlock .flip .card{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;pointer-events:none}
.unlock .flip .card.f{transform:rotateY(180deg)}
.unlock .flip.open{transform:rotateY(180deg)}
.unlock .label{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 96px);text-align:center;font-family:var(--title);font-weight:900;font-size:clamp(22px,6.5vw,36px);
  letter-spacing:.1em;color:var(--gold-2);text-shadow:0 0 20px rgba(232,181,74,.7);opacity:0;transform:translateY(20px);transition:all .6s .2s}
.unlock .label.show{opacity:1;transform:none}
.unlock .label small{display:block;font-family:var(--ui);font-weight:600;font-size:15px;letter-spacing:.35em;color:var(--white);margin-top:6px}
.unlock .actions{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 24px);display:flex;justify-content:center;gap:10px;padding:0 14px;opacity:0;transition:opacity .5s .6s}
.unlock .actions.show{opacity:1}
.unlock .actions .btn{white-space:nowrap;padding:12px 18px;font-size:16px}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,3px) rotate(-1deg)}40%{transform:translate(5px,-4px) rotate(1deg)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.unlock.manga{background:#f4f2ec}
.unlock.manga .label{color:#050505;text-shadow:3px 3px 0 #fff,-3px -3px 0 #fff;font-style:italic}
.unlock.manga .label small{color:#050505}
.hover{animation:hover 1.6s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px) rotate(-1deg)}}

/* Diálogo */
.dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(2,4,10,.75);padding:20px}
.dialog .box{max-width:380px;width:100%;padding:20px;border-radius:18px;background:var(--navy-2);border:1px solid rgba(232,181,74,.35)}
.dialog .box h3{margin:0 0 8px;font-family:var(--title);color:var(--gold-2)}
.dialog .row{justify-content:flex-end;margin-top:16px}

.diag-list{display:flex;flex-direction:column;gap:8px}
.diag-item{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:12px;background:rgba(5,9,22,.6)}
.diag-item b{font-weight:600}
.diag-item .d{grid-column:2;color:var(--muted);font-size:14px;word-break:break-word}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%);z-index:70;padding:10px 16px;border-radius:12px;
  background:var(--navy-3);border:1px solid var(--gold);color:var(--white);box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:16px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Escáner con cámara */
.scan{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .frame{position:absolute;left:50%;top:45%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22px;
  box-shadow:0 0 0 9999px rgba(3,6,15,.6);border:2px solid var(--gold)}
.scan .frame::after{content:"";position:absolute;left:8%;right:8%;height:2px;top:50%;background:var(--gold-2);box-shadow:0 0 12px var(--gold);animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:12%}50%{top:88%}}
.scan .hint{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 70px);text-align:center;font-size:18px;letter-spacing:.06em;text-shadow:0 2px 8px #000;padding:0 20px}
.scan .bar3d{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(var(--safe-t) + 10px) 14px 10px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(232,181,74,.18),rgba(11,20,48,.7));border:1px solid rgba(232,181,74,.45)}
.banner p{margin:0;font-size:15px;line-height:1.3;flex:1}
textarea{font:inherit;font-size:14px;width:100%;min-height:90px;color:var(--white);background:#050916;border:1px solid rgba(232,181,74,.35);border-radius:12px;padding:10px;outline:none;word-break:break-all}
</style>
</head>
<body>
<div id="root"></div>
<noscript>SAM PIECE 3D necesita JavaScript.</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
